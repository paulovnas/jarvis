[package]
name = "tauri-runtime-cef"
version = "0.1.0"
# lets `tauri-build` detect the CEF runtime through the `DEP_TAURI_RUNTIME_CEF_RUNTIME` env var
links = "tauri_runtime_cef"
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/tauri-apps/tauri"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.95"

[[test]]
name = "macos-application-bootstrap"
harness = false

[dependencies]
tauri = { version = "=2.11.5", git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", default-features = false, features = ["gtk4"] }
tauri-macros = { version = "=2.6.3", git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
base64 = "0.22"
cef = { version = "=151.8.1", features = ["build-util", "linux-x11"] }
# Not actually used directly, just locking it.
cef-dll-sys = { version = "=151.8.1", default-features = false }
dirs = "6"
dioxus-debug-cell = "0.1"
http = "1"
kuchiki = { package = "kuchikiki", version = "0.8.8-speedreader" }
html5ever = "0.29"
log = "0.4.21"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-runtime = { version = "=2.11.3", git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-utils = { version = "=2.9.3", git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", features = [
  "html-manipulation",
] }
url = "2"
winit = { version = "0.31.0-beta.2", git = "https://github.com/tauri-apps/winit-gtk4", branch = "master", default-features = false, features = [
  "gtk4",
] }

[target."cfg(windows)".dependencies]
softbuffer = { version = "0.4", default-features = false }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_Globalization",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"macos\")".dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "CGColorSpace",
  "CGDataProvider",
  "CGImage",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "HIServices",
  "Processes",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSAccessibility",
  "NSAccessibilityConstants",
  "NSAccessibilityElement",
  "NSAccessibilityProtocols",
  "NSBezierPath",
  "NSColor",
  "NSControl",
  "NSCursor",
  "NSDockTile",
  "NSEvent",
  "NSImage",
  "NSImageView",
  "NSProgressIndicator",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
  "block2",
  "objc2-core-graphics",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "CALayer",
  "CATransaction",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  # NSDate gates the performSelector:withObject:afterDelay: binding used to
  # restore the traffic light position after an appearance change.
  "NSDate",
  # NSLocale gives the user's preferred languages, which become the
  # Accept-Language list; without it every user would report en-US.
  "NSLocale",
  "NSNotification",
  "NSObject",
  "NSRange",
  "NSValue",
  "NSRunLoop",
  "NSString",
  "NSThread",
  "NSTimer",
  "NSURL",
] }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
dlopen2 = { version = "0.8", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11.4" }
gdkx11 = { package = "gdk4-x11", version = "0.11.4" }
libc = "0.2"
x11-dl = "2.21"

[features]
default = []
browser-probe = []
# also enables devtools on `tauri` so the feature only needs to be enabled on this crate
devtools = ["tauri-runtime/devtools", "tauri/devtools"]
# also enables macos-private-api on `tauri` so the feature only needs to be enabled on this crate
macos-private-api = [
  "tauri-runtime/macos-private-api",
  "tauri/macos-private-api",
]
# exposes the extension traits for `tauri::webview::WebviewBuilder`
unstable = ["tauri/unstable"]
