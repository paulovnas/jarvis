[package]
name = "jarvis"
version = "1.0.0"
description = "Jarvis — ambiente de desenvolvimento com agentes de IA"
authors = ["Paulo Vitor Nascimento"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
browser-probe = []

[[example]]
name = "browser-probe"
required-features = ["browser-probe"]

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
libc = "0.2.189"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
jsonschema = { version = "0.53.0", default-features = false }
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
similar = "2.7"
serde_yaml_ng = "0.10"
regex = "1"
tempfile = "3"
semver = "1"
keepawake = "0.6.1"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pdf-extract = "0.12"
quick-xml = "0.42"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
portable-pty = "0.9"
fontdb = "0.24.0"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["UI_Notifications", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
windows-registry = "0.6"

[target.'cfg(windows)'.dev-dependencies]
junction = "2.0.0"
