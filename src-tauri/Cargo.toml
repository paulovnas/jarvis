[package]
name = "jarvis"
version = "0.8.3-beta.1"
description = "Jarvis — ambiente de desenvolvimento com agentes de IA"
authors = ["Paulo Vitor Nascimento"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
libc = "0.2.189"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
jsonschema = { version = "0.53.0", default-features = false }
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
similar = "2.7"
serde_yaml_ng = "0.10"
regex = "1"
tempfile = "3"
semver = "1"
keepawake = "0.6.1"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pdf-extract = "0.12"
quick-xml = "0.42"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"
