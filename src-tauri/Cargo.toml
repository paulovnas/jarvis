[package]
name = "jarvis"
version = "2.0.7"
description = "Jarvis — ambiente de desenvolvimento com agentes de IA"
authors = ["Paulo Vitor Nascimento"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
browser-probe = ["tauri-runtime-cef/browser-probe", "dep:cef"]

[[example]]
name = "browser-probe"
required-features = ["browser-probe"]

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset", "macos-private-api"] }
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1", features = ["unstable", "macos-private-api", "devtools"] }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
if-addrs = "0.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }

base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "835adce473e8f059f6ba84660dd07bcb19fb9030", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
libc = "0.2.189"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
async-trait = "0.1"
sse-stream = "0.2.4"
jsonschema = { version = "0.53.0", default-features = false }
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
similar = "2.7"
serde_yaml_ng = "0.10"
regex = "1"
tempfile = "3"
semver = "1"
keepawake = "0.6.1"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pdf-extract = "0.12"
quick-xml = "0.42"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
portable-pty = "0.9"
fontdb = "0.24.0"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
cpal = "0.17.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "hound"] }
whisper-rs = "0.16.0"
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
security-framework = { version = "3.7", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
objc2-app-kit = "0.3"
dispatch2 = "0.3"
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "objc2", "libc", "HIServices", "AXError", "AXUIElement", "AXValue"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "libc", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "CGSession", "CGImage", "CGGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
cef = { version = "=151.8.1", optional = true }
x11-dl = "2.21"
raw-window-handle = "0.6"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify-rust = "4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61", features = ["UI_Notifications", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
windows-registry = "0.6"

[target.'cfg(windows)'.dev-dependencies]
junction = "2.0.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }

# CEF uses Tauri's dynamic runtime contract; keep plugins and bundler on one revision.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", rev = "9d1a5b176e337c8395362a4e7c99bac99b36a1d1" }
# CEF and its window runtime share DPI types; Cargo.lock pins this upstream revision.
dpi = { git = "https://github.com/tauri-apps/winit-gtk4", branch = "master" }

# Preserve the official CEF runtime while fixing native lifetime bugs locally.
[patch."https://github.com/tauri-apps/tauri"]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

# Keep the native test binary within macOS unwind-table limits.
[profile.test.package.jarvis]
opt-level = 1
