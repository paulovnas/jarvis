[package]
name = "jarvis"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
libc = "0.2.189"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
jsonschema = { version = "0.53.0", default-features = false }
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
similar = "2.7"
serde_yaml_ng = "0.10"
regex = "1"
tempfile = "3"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
